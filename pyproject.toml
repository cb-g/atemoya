[project]
name = "atemoya"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "scipy>=1.18.1",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260730",
    "pyright>=1.1.411",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["python"]
# generated by atdpy from schema/*.atd; used for types, not held to strict
ignore = ["python/boundary.py", "python/reference.py"]
stubPath = "typings"
executionEnvironments = [{ root = "python" }]
